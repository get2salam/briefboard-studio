<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Briefboard Studio — turn messy client notes into a structured project brief, entirely in your browser."
    />
    <title>Briefboard Studio</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h13' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Briefboard Studio</h1>
          <p class="tagline">From messy notes to a shareable brief.</p>
        </div>
      </div>
      <nav class="toolbar" aria-label="Primary actions">
        <button type="button" data-action="load-sample" class="btn btn-ghost">
          Load sample
        </button>
        <button type="button" data-action="reset" class="btn btn-ghost">
          New brief
        </button>
        <button type="button" data-action="copy-md" class="btn btn-secondary">
          Copy as Markdown
        </button>
        <button type="button" data-action="export-json" class="btn btn-primary">
          Export
        </button>
      </nav>
    </header>

    <main class="app-grid">
      <section class="editor" aria-labelledby="editor-heading">
        <h2 id="editor-heading" class="visually-hidden">Editor</h2>

        <div class="field">
          <label for="project-title">Project title</label>
          <input
            id="project-title"
            type="text"
            data-field="title"
            placeholder="e.g. Acme Corp — Onboarding redesign"
            autocomplete="off"
          />
        </div>

        <div class="field field-row">
          <div>
            <label for="client-name">Client</label>
            <input
              id="client-name"
              type="text"
              data-field="client"
              placeholder="Client name"
              autocomplete="off"
            />
          </div>
          <div>
            <label for="owner-name">Owner</label>
            <input
              id="owner-name"
              type="text"
              data-field="owner"
              placeholder="Your name"
              autocomplete="off"
            />
          </div>
          <div>
            <label for="due-date">Target date</label>
            <input id="due-date" type="date" data-field="dueDate" />
          </div>
        </div>

        <div class="field">
          <label for="raw-notes">Raw notes</label>
          <textarea
            id="raw-notes"
            data-field="rawNotes"
            rows="6"
            placeholder="Paste your messy call notes, email threads, or scribbles here. Briefboard keeps them alongside the structured brief so nothing gets lost."
          ></textarea>
        </div>

        <div class="field">
          <label for="summary">Summary</label>
          <textarea
            id="summary"
            data-field="summary"
            rows="3"
            placeholder="One short paragraph. What is this project and why does it matter?"
          ></textarea>
        </div>

        <div class="sections">
          <div class="field list-field">
            <div class="list-head">
              <label>Goals</label>
              <button type="button" class="btn btn-tiny" data-add="goals">
                + Add goal
              </button>
            </div>
            <ul class="bullet-list" data-list="goals"></ul>
          </div>

          <div class="field list-field">
            <div class="list-head">
              <label>Deliverables</label>
              <button
                type="button"
                class="btn btn-tiny"
                data-add="deliverables"
              >
                + Add deliverable
              </button>
            </div>
            <ul class="bullet-list" data-list="deliverables"></ul>
          </div>

          <div class="field list-field">
            <div class="list-head">
              <label>Risks &amp; open questions</label>
              <button type="button" class="btn btn-tiny" data-add="risks">
                + Add risk
              </button>
            </div>
            <ul class="bullet-list" data-list="risks"></ul>
          </div>

          <div class="field list-field">
            <div class="list-head">
              <label>Timeline</label>
              <button type="button" class="btn btn-tiny" data-add="timeline">
                + Add milestone
              </button>
            </div>
            <ul class="bullet-list timeline-list" data-list="timeline"></ul>
          </div>

          <div class="field list-field">
            <div class="list-head">
              <label>Next steps</label>
              <button type="button" class="btn btn-tiny" data-add="nextSteps">
                + Add step
              </button>
            </div>
            <ul class="bullet-list" data-list="nextSteps"></ul>
          </div>
        </div>
      </section>

      <aside class="preview" aria-labelledby="preview-heading">
        <div class="preview-head">
          <h2 id="preview-heading">Live preview</h2>
          <span class="save-indicator" data-save-indicator aria-live="polite"
            >Saved locally</span
          >
        </div>
        <article class="brief" data-preview></article>
      </aside>
    </main>

    <footer class="app-footer">
      <span>Built as a lightweight, local-only tool. Your data never leaves this browser.</span>
      <span class="kbd-hint">
        <kbd>Ctrl</kbd>+<kbd>S</kbd> copies Markdown
      </span>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
